<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FBF7F0" />
<meta name="robots" content="noindex, nofollow" />
<title>KRUMBLE ROASTERS · ORIGIN MAP</title>
<meta name="description" content="크럼블로스터스 커피 산지·농장 지도 — 원두 이름을 검색하면 한 잔이 시작된 곳을 보여줍니다." />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root{
    --cream:#FBF7F0;
    --cream-2:#F3ECE1;
    --ink:#221E1A;
    --ink-soft:#5A5148;
    --line:#E2D8C9;
    --terra:#C2603C;
    --terra-soft:#E8B9A6;
    --green:#2F4636;
    --green-soft:#7E9478;
    --shadow:0 10px 30px -18px rgba(34,30,26,.45);
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font-family:inherit}

  .app{display:flex;flex-direction:column;height:100dvh}

  /* ---------- header ---------- */
  .head{padding:18px 18px 12px;flex:none;background:var(--cream);position:relative;z-index:5}
  .brand{display:flex;align-items:center;gap:9px}
  .bean{width:22px;height:22px;flex:none}
  .brand-txt{font-size:11.5px;letter-spacing:.22em;font-weight:700;color:var(--ink)}
  .brand-txt span{color:var(--terra)}
  .lede{margin:10px 0 0;font-size:22px;line-height:1.28;font-weight:700;letter-spacing:-.02em}
  .lede em{font-style:normal;color:var(--terra)}
  .lede small{display:block;margin-top:6px;font-size:12.5px;font-weight:500;color:var(--ink-soft);letter-spacing:0}

  /* ---------- search ---------- */
  .search{position:relative;margin:14px 0 0}
  .search-box{
    display:flex;align-items:center;gap:9px;
    background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:0 6px 0 14px;height:48px;box-shadow:var(--shadow);
    transition:border-color .18s ease, box-shadow .18s ease;
  }
  .search-box:focus-within{border-color:var(--terra);box-shadow:0 0 0 4px rgba(194,96,60,.10)}
  .search-box svg{flex:none;color:var(--ink-soft)}
  #q{flex:1;min-width:0;border:0;outline:0;background:none;font-size:15px;color:var(--ink)}
  #q::placeholder{color:#A79C8D}
  .go{
    flex:none;height:36px;padding:0 15px;border-radius:999px;background:var(--ink);color:#FFF8EF;
    font-size:12.5px;font-weight:700;letter-spacing:.02em;
  }
  .go:active{transform:scale(.97)}
  .sugg{
    position:absolute;left:0;right:0;top:54px;z-index:30;
    background:#fff;border:1px solid var(--line);border-radius:16px;
    box-shadow:0 22px 50px -20px rgba(34,30,26,.4);
    padding:6px;display:none;max-height:46vh;overflow:auto;
  }
  .sugg.on{display:block}
  .sugg button{
    display:flex;width:100%;text-align:left;gap:10px;align-items:center;
    padding:9px 10px;border-radius:11px;
  }
  .sugg button:hover,.sugg button:focus-visible{background:var(--cream-2)}
  .sugg .nm{font-weight:700;font-size:13.5px;letter-spacing:-.01em}
  .sugg .mt{font-size:11.5px;color:var(--ink-soft);margin-top:1px}
  .sugg .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .sugg .live{padding:10px;font-size:12.5px;color:var(--ink-soft)}

  /* ---------- chips ---------- */
  .chips{
    flex:none;display:flex;gap:7px;overflow-x:auto;padding:12px 18px 12px;
    scrollbar-width:none;background:var(--cream);position:relative;z-index:4;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);
    background:#fff;font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;
    display:inline-flex;align-items:center;gap:5px;transition:all .16s ease;
  }
  .chip.on{background:var(--ink);border-color:var(--ink);color:#FFF8EF}
  .chip.on .cnt{color:var(--terra-soft)}
  .chip .cnt{font-size:10.5px;opacity:.7;font-weight:700}
  .chip.star.on{background:var(--terra);border-color:var(--terra);color:#fff}

  /* ---------- map ---------- */
  .mapwrap{position:relative;flex:none;height:40dvh;min-height:240px;background:var(--cream-2);z-index:1}
  #map{position:absolute;inset:0;background:var(--cream-2)}
  .leaflet-container{font-family:inherit;background:#EFE7DA}
  .leaflet-tile-pane{filter:sepia(.12) saturate(.9) brightness(1.02)}
  .leaflet-control-attribution{font-size:9.5px!important;background:rgba(251,247,240,.86)!important;color:#6B6259!important}
  .leaflet-control-attribution a{color:#6B6259!important}
  .leaflet-control-zoom{border:0!important;box-shadow:var(--shadow)!important;margin:10px 10px 0 0!important}
  .leaflet-control-zoom a{background:#fff!important;color:var(--ink)!important;border-color:var(--line)!important;width:30px!important;height:30px!important;line-height:28px!important;font-size:16px!important}

  .pin{
    width:26px;height:26px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);
    background:var(--green);border:2.5px solid #FFFDF8;
    box-shadow:0 4px 12px -4px rgba(34,30,26,.55);
    display:flex;align-items:center;justify-content:center;transition:all .18s ease;
  }
  .pin i{transform:rotate(45deg);font-style:normal;font-size:10px;font-weight:800;color:#FFFDF8;letter-spacing:-.03em}
  .pin.lineup{background:var(--terra);width:30px;height:30px}
  .pin.live{background:var(--ink);width:24px;height:24px;border-style:dashed}
  .pin.sel{transform:rotate(-45deg) scale(1.22);box-shadow:0 8px 20px -6px rgba(34,30,26,.6)}
  .pin-wrap.sel::after{
    content:"";position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;
    border-radius:50%;border:2px solid rgba(194,96,60,.45);animation:pulse 1.9s ease-out infinite;
  }
  @keyframes pulse{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.25);opacity:0}}

  .map-hint{
    position:absolute;left:14px;bottom:12px;z-index:500;display:flex;align-items:center;gap:6px;
    background:rgba(255,253,248,.94);backdrop-filter:blur(6px);border:1px solid var(--line);
    border-radius:999px;padding:6px 11px;font-size:10.5px;font-weight:600;color:var(--ink-soft);
    box-shadow:var(--shadow);pointer-events:none;
  }
  .map-hint b{color:var(--terra);font-weight:800}
  .lt-tip{
    background:#FFFDF8!important;border:1px solid var(--line)!important;border-radius:10px!important;
    color:var(--ink)!important;font-size:11.5px!important;font-weight:700!important;
    box-shadow:var(--shadow)!important;padding:4px 8px!important;
  }
  .lt-tip::before{border-top-color:#FFFDF8!important}
  .lt-tip span{color:var(--ink-soft)!important;font-weight:500!important;display:block;font-size:10px!important}

  /* ---------- sheet ---------- */
  .sheet{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 40px;background:var(--cream)}
  @media(max-width:899px){ .app.has-sel .mapwrap{height:30dvh;transition:height .3s ease} }
  .sheet::-webkit-scrollbar{width:0}

  .card{
    background:#fff;border:1px solid var(--line);border-radius:var(--r);
    padding:18px;box-shadow:var(--shadow);animation:rise .32s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .eyebrow{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--terra);text-transform:uppercase}
  .badge{
    display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;letter-spacing:.06em;
    padding:3px 7px;border-radius:5px;background:var(--cream-2);color:var(--ink-soft);text-transform:uppercase;
  }
  .badge.ok{background:#E7EEE4;color:#37563C}
  .badge.region{background:#F6EBDD;color:#8A5A2B}
  .badge.sample{background:#E8EDF4;color:#3C5573}
  .badge.live{background:#EFE9E2;color:#4B4238}

  .c-name{margin:9px 0 0;font-size:20px;font-weight:800;letter-spacing:-.025em;line-height:1.28;word-break:keep-all;overflow-wrap:break-word}
  .c-en{margin:4px 0 0;font-size:11.5px;color:var(--ink-soft);letter-spacing:.02em}
  .c-region{margin:10px 0 0;font-size:13px;font-weight:600;color:var(--green);display:flex;align-items:center;gap:5px}
  .c-region svg{flex:none}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:16px 0 0;background:var(--line);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .stat{background:#FFFDF8;padding:10px 12px}
  .stat dt{font-size:9.5px;font-weight:800;letter-spacing:.1em;color:#9A8F80;text-transform:uppercase;margin:0}
  .stat dd{margin:3px 0 0;font-size:13px;font-weight:700;letter-spacing:-.01em;word-break:keep-all}
  .stat.wide{grid-column:1/-1}

  .notes{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
  .note{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#F7EFE4;color:#8A5A2B;border:1px solid #EFDFC9}

  .story{margin:16px 0 0;font-size:13.5px;line-height:1.72;color:#3D372F;word-break:keep-all}
  .story::first-letter{font-weight:800}

  .src{margin:16px 0 0;padding:12px 13px;background:var(--cream);border-radius:12px;border:1px dashed var(--line)}
  .src .row{display:flex;gap:8px;font-size:11.5px;line-height:1.6;color:var(--ink-soft)}
  .src .row + .row{margin-top:5px}
  .src .k{flex:none;font-weight:800;color:#9A8F80;letter-spacing:.04em;font-size:10px;padding-top:2px;width:52px}
  .src a{color:var(--terra);text-decoration:none;border-bottom:1px solid var(--terra-soft)}

  .qr{margin:14px 0 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .qr code{
    flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
    background:#F7F2E9;border:1px solid var(--line);border-radius:9px;padding:9px 10px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#4B4238;
  }
  .qr-note{margin:7px 0 0;font-size:10.5px;color:#A79C8D;line-height:1.55}
  .copy{flex:none;font-size:11.5px;font-weight:800;padding:9px 13px;border-radius:9px;background:var(--ink);color:#FFF8EF}
  .copy.done{background:var(--green)}

  /* lineup quick picks */
  .quick{margin-top:16px}
  .quick h3{margin:0 0 9px;font-size:10.5px;font-weight:800;letter-spacing:.14em;color:#9A8F80;text-transform:uppercase}
  .qrow{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .qrow::-webkit-scrollbar{display:none}
  .qcard{
    flex:none;width:118px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:10px 11px;box-shadow:var(--shadow);
  }
  .qcard.on{border-color:var(--terra);box-shadow:0 0 0 2px rgba(194,96,60,.18)}
  .qcard .qtop{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--terra)}
  .qcard .qn{margin-top:5px;font-size:12.5px;font-weight:800;line-height:1.35;letter-spacing:-.01em}
  .qcard .qm{margin-top:4px;font-size:10.5px;color:var(--ink-soft)}

  /* results list */
  .results{margin:0}
  .res-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .res-head h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.02em}
  .res-head span{font-size:11.5px;color:var(--ink-soft)}
  .res{display:flex;width:100%;text-align:left;gap:11px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:8px;box-shadow:var(--shadow)}
  .res.on{border-color:var(--terra);box-shadow:0 0 0 2px rgba(194,96,60,.16)}
  .res .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
  .res .rn{display:block;font-size:13.5px;font-weight:800;letter-spacing:-.01em}
  .res .rm{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px}
  .res .rt{display:block;font-size:10.5px;font-weight:800;color:var(--terra);margin-top:3px;letter-spacing:.02em}

  .empty{background:#fff;border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center}
  .empty h3{margin:0 0 6px;font-size:14.5px;font-weight:800}
  .empty p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.65}
  .empty .tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
  .empty .tags button{font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--cream-2);color:var(--ink-soft)}

  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--terra);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}

  .foot{margin-top:22px;font-size:10.5px;line-height:1.7;color:#A79C8D;text-align:center}
  .foot b{color:#8A8074;font-weight:700}

  /* ---------- desktop ---------- */
  @media(min-width:900px){
    .app{
      display:grid;height:100dvh;
      grid-template-columns:minmax(390px,430px) 1fr;
      grid-template-rows:auto auto 1fr;
      grid-template-areas:"head map" "chips map" "sheet map";
    }
    .head{grid-area:head;padding:26px 26px 14px}
    .chips{grid-area:chips;padding:14px 26px 14px}
    .sheet{grid-area:sheet;padding:16px 26px 40px}
    .mapwrap{grid-area:map;height:auto;min-height:0;border-left:1px solid var(--line)}
    .lede{font-size:25px}
    .card{padding:20px}
    .c-name{font-size:22px}
    .sheet{border-right:1px solid var(--line)}
  }
  @media(max-width:400px){
    .lede{font-size:20px}
    .stat dd{font-size:12.5px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <div class="brand">
      <svg class="bean" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <ellipse cx="12" cy="12" rx="7.4" ry="10" transform="rotate(35 12 12)" fill="#C2603C"/>
        <path d="M7.4 16.6C10.6 14.4 11 9.6 16.6 7.4" stroke="#FBF7F0" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div class="brand-txt">KRUMBLE ROASTERS <span>·</span> ORIGIN MAP</div>
    </div>
    <p class="lede">한 잔이 시작된 곳<em>.</em>
      <small>마시거나 사 간 원두의 산지·농장을 지도에서 만나보세요.</small>
    </p>

    <form class="search" id="searchForm" autocomplete="off">
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" enterkeyhint="search" placeholder="원두·산지·농장·컵노트 검색" aria-label="커피 검색" />
        <button class="go" type="submit">검색</button>
      </div>
      <div class="sugg" id="sugg" role="listbox" aria-label="검색 제안"></div>
    </form>
  </header>

  <div class="chips" id="chips" role="tablist" aria-label="산지 필터"></div>

  <div class="mapwrap">
    <div id="map" aria-label="커피 산지 지도"></div>
    <div class="map-hint">
      <span class="badge lineup" style="background:#C2603C;color:#fff;padding:2px 6px;font-size:9px">LINEUP</span>
      크럼블 라인업 · <b>핀</b>을 눌러보세요
    </div>
  </div>

  <main class="sheet" id="sheet"></main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =========================================================
   KRUMBLE ROASTERS · ORIGIN MAP  (prototype v0.1)
   - tier "lineup" : 실제 구매한 생두 (공급사 페이지·구매 기록 기반)
   - tier "origin" : 내장 산지 DB (지역 단위 좌표)
   - tier "farm"   : 확인된 개별 농장
   - tier "live"   : Nominatim 실시간 지오코딩 결과
   ========================================================= */

const BASE_URL = location.origin + location.pathname;

/* ---------- 1. 크럼블 라인업 (실제 구매 생두) ---------- */
const LINEUP = [
  {

    process: "워시드 (Fully Washed)",

    story: "페루 북부 카하마르카의 산이그나시오, 에콰도르 국경 가까운 엘 디아만테 마을에서 자란 게이샤입니다. 안데스의 차고 습한 기후가 체리를 천천히 익혀 꽃향과 밝은 시트러스 산미를 남깁니다. 크럼블로스터스가 2026년 11월 콤파스커피에서 들여온 하우스 게이샤예요.",
    lat: -4.9867, lon: -78.9253,
    tier: "lineup", confidence: "ok", confidenceLabel: "농장 확인",
    purchase: { supplier: "콤파스커피", date: "2026-11-16", memo: "네이버페이 주문 · 진공포장 출고" },
    source: { label: "콤파스커피 상품 페이지", url: "https://compasscoffee.kr/product/PE_Diamante_Geisha" },
    aliases: ["엘디아만테", "디아만테", "diamante", "카하마르카", "cajamarca", "산이그나시오", "san ignacio", "게이샤", "게샤", "geisha", "페루"]
  },
  {
    id: "santa-felisa-2722",
    ko: "과테말라 산타펠리사 게샤 2722 더블 소크",
    en: "Guatemala Santa Felisa Gesha 2722 Fully Washed Double Soak 1600",
    country: "과테말라", countryEn: "Guatemala",
    region: "아카테낭고 밸리 (Acatenango, Chimaltenango)",
    farm: "핀카 산타펠리사 (Finca Santa Felisa)",
    producer: "아나베야 · 안토니오 메네세스 (4세대)",
    alt: "1,600m (농장 1,520~1,900m)",
    variety: "게샤 2722 (Gesha T2722)",

const ALL = [...LINEUP, ...ORIGINS];

/* ---------- 3. 상태 ---------- */
const state = {
  filter: "all",        // "all" | "lineup" | country
  selected: null,       // 선택된 item
  results: null,        // 검색 결과 배열
  livePin: null,
  geocoding: false
};

const $ = (s, el = document) => el.querySelector(s);
const sheetEl = $("#sheet");
const sugEl = $("#sugg");
const qEl = $("#q");

const fmtNote = (n) => `<span class="note">${n}</span>`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- 4. 지도 ---------- */
const map = L.map("map", {
  zoomControl: true,
  attributionControl: true,
  worldCopyJump: true,
  minZoom: 2,
  maxZoom: 16,
  scrollWheelZoom: true
}).setView([8, 20], 2);

L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 16,
  maxNativeZoom: 16,
  attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
}).addTo(map);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 16,
  maxNativeZoom: 16,
  pane: "overlayPane"
}).addTo(map);

const pinLayer = L.layerGroup().addTo(map);
const markers = new Map(); // id -> marker

function pinIcon(item, selected) {
  const cls = ["pin"];
  if (item.tier === "lineup") cls.push("lineup");
  if (item.tier === "live") cls.push("live");
  if (selected) cls.push("sel");
  const label = item.tier === "lineup" ? "★" : (item.tier === "live" ? "?" : "•");
  return L.divIcon({
    className: "pin-wrap" + (selected ? " sel" : ""),
    html: `<div class="${cls.join(" ")}"><i>${label}</i></div>`,
    iconSize: item.tier === "lineup" ? [30, 30] : [26, 26],
    iconAnchor: item.tier === "lineup" ? [15, 30] : [13, 26],
    tooltipAnchor: [0, -24]
  });
}

function visibleItems() {
  if (state.results && state.results.length > 1) return state.results;
  if (state.filter === "lineup") return LINEUP;
  if (state.filter === "all") return ALL;
  return ALL.filter((i) => i.country === state.filter);
}

function drawPins() {
  pinLayer.clearLayers();
  markers.clear();
  const items = visibleItems();
  const bounds = [];
  items.forEach((item) => {
    const isSel = state.selected && state.selected.id === item.id;
    const m = L.marker([item.lat, item.lon], {
      icon: pinIcon(item, isSel),
      riseOnHover: true,
      keyboard: true,
      title: item.ko
    });
    m.bindTooltip(`<b>${esc(item.ko)}</b><span>${esc(item.region)}</span>`, {
      direction: "top", className: "lt-tip", offset: [0, 0]
    });
    m.on("click", () => selectItem(item, { fly: true, source: "pin" }));
    m.addTo(pinLayer);
    markers.set(item.id, m);
    bounds.push([item.lat, item.lon]);
  });
  if (state.livePin) {
    const m = L.marker([state.livePin.lat, state.livePin.lon], { icon: pinIcon(state.livePin, true), title: state.livePin.ko });
    m.bindTooltip(`<b>${esc(state.livePin.ko)}</b><span>실시간 검색 위치</span>`, { direction: "top", className: "lt-tip" });
    m.on("click", () => selectItem(state.livePin, { fly: true, source: "pin" }));
    m.addTo(pinLayer);
    markers.set(state.livePin.id, m);
    bounds.push([state.livePin.lat, state.livePin.lon]);
  }
  if (bounds.length && !state.selected) {
    map.fitBounds(bounds, { padding: [42, 42], maxZoom: 5, animate: true });
  }
}

function highlightPin() {
  markers.forEach((m, id) => {
    const item = [...visibleItems(), state.livePin].filter(Boolean).find((i) => i.id === id);
    if (!item) return;
    const sel = state.selected && state.selected.id === id;
    m.setIcon(pinIcon(item, sel));
  });
}

/* ---------- 5. 칩 ---------- */
function countryCounts() {
  const m = new Map();
  LINEUP.forEach((i) => m.set(i.country, (m.get(i.country) || 0) + 1));
  ORIGINS.forEach((i) => m.set(i.country, (m.get(i.country) || 0) + 1));
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}

function renderChips() {
  const chips = [];
  chips.push(`<button class="chip star ${state.filter === "lineup" ? "on" : ""}" data-filter="lineup">★ 내 라인업 <span class="cnt">${LINEUP.length}</span></button>`);
  chips.push(`<button class="chip ${state.filter === "all" ? "on" : ""}" data-filter="all">전체 산지 <span class="cnt">${ALL.length}</span></button>`);
  countryCounts().forEach(([c, n]) => {
    chips.push(`<button class="chip ${state.filter === c ? "on" : ""}" data-filter="${esc(c)}">${esc(c)} <span class="cnt">${n}</span></button>`);
  });
  $("#chips").innerHTML = chips.join("");
  $("#chips").querySelectorAll(".chip").forEach((b) => {
    b.onclick = () => {
      state.filter = b.dataset.filter;
      state.selected = null;
      state.results = null;
      document.querySelector(".app").classList.remove("has-sel");
      setTimeout(() => map.invalidateSize(), 340);
      renderChips();
      drawPins();
      renderSheet();
      if (!state.selected) {
        const pts = visibleItems().map((i) => [i.lat, i.lon]);
        if (pts.length) map.fitBounds(pts, { padding: [50, 50], maxZoom: 5 });
      }
    };
  });
}

/* ---------- 6. 검색 ---------- */
function norm(s) {
  return String(s || "").toLowerCase()
    .replace(/[\s·・,\.\(\)\[\]\/\-_'’"“”]/g, "")
    .replace(/게샤/g, "게이샤");
}

function haystack(item) {
  return norm([
    item.ko, item.en, item.country, item.countryEn, item.region,
    item.farm, item.producer, item.alt, item.variety, item.process,
    (item.notes || []).join(" "), (item.aliases || []).join(" "),
    item.tier === "lineup" ? "라인업 크럼블" : ""
  ].join(" "));
}

function scoreItem(item, query) {
  const q = norm(query);
  if (!q) return 0;
  const tokens = q.split("+").filter(Boolean);
  const hay = haystack(item);
  // 모든 토큰이 어딘가에 있어야 후보 (공백 검색은 토큰 AND)
  if (tokens.length > 1 && !tokens.every((t) => hay.includes(t))) return 0;
  let score = 0;
  const nameKo = norm(item.ko), nameEn = norm(item.en);
  if (nameKo === q || nameEn === q) score += 200;
  if (nameKo.startsWith(q) || nameEn.startsWith(q)) score += 120;
  if (nameKo.includes(q) || nameEn.includes(q)) score += 90;
  if (norm(item.farm).includes(q)) score += 70;
  if (norm(item.region).includes(q)) score += 55;
  if (norm((item.aliases || []).join(" ")).includes(q)) score += 45;
  if (norm(item.country).includes(q) || norm(item.countryEn).includes(q)) score += 35;
  if (norm(item.variety).includes(q) || norm(item.process).includes(q)) score += 25;
  if (norm((item.notes || []).join(" ")).includes(q)) score += 22;
  // 토큰 단위 가중
  tokens.forEach((t) => {
    if (nameKo.includes(t) || nameEn.includes(t)) score += 30;
    else if (hay.includes(t)) score += 8;
  });
  if (score > 0 && item.tier === "lineup") score += 12;
  return score;
}

function searchLocal(query) {
  const q = String(query || "").trim();
  if (!q) return [];
  // 공백 검색은 AND로 처리하기 위해 "+" 로 이어 norm에서 공백 제거
  const joined = q.split(/\s+/).join("+");
  return ALL
    .map((item) => ({ item, s: scoreItem(item, joined) }))
    .filter((r) => r.s > 0)
    .sort((a, b) => b.s - a.s)
    .map((r) => r.item);
}

function toEnglish(query) {
  let out = query;
  Object.keys(KO2EN).sort((a, b) => b.length - a.length).forEach((k) => {
    out = out.split(k).join(" " + KO2EN[k] + " ");
  });
  return out.replace(/\s+/g, " ").trim();
}

async function nominatimSearch(q) {
  const url = "https://nominatim.openstreetmap.org/search?" + new URLSearchParams({
    format: "jsonv2", limit: "5", "accept-language": "ko,en", q
  });
  const res = await fetch(url, { headers: { "Accept": "application/json" } });
  if (!res.ok) throw new Error("nominatim " + res.status);
  const arr = await res.json();
  return (arr || []).map((r) => ({
    name: r.name || (r.display_name || "").split(",")[0],
    display_name: r.display_name,
    lat: parseFloat(r.lat), lon: parseFloat(r.lon),
    id: (r.osm_type || "x") + "-" + (r.osm_id || Math.random().toString(36).slice(2))
  }));
}

async function photonSearch(q) {
  const url = "https://photon.komoot.io/api/?" + new URLSearchParams({ q, limit: "5", lang: "ko" });
  const res = await fetch(url);
  if (!res.ok) throw new Error("photon " + res.status);
  const j = await res.json();
  return (j.features || []).map((f) => {
    const p = f.properties || {};
    const c = (f.geometry && f.geometry.coordinates) || [0, 0];
    const parts = [p.name, p.city || p.county || p.district, p.state, p.country].filter(Boolean);
    return {
      name: p.name || parts[0] || q,
      display_name: parts.length ? parts.join(", ") : q,
      lat: c[1], lon: c[0],
      id: "ph-" + (p.osm_type || "x") + "-" + (p.osm_id || Math.random().toString(36).slice(2))
    };
  });
}

async function geocode(query) {
  const en = toEnglish(query);
  const tries = [
    ["nominatim", en],
    ["photon", en],
    ["nominatim", en + " coffee farm"],
    ["photon", en + " coffee"],
    ["nominatim", query]
  ];
  for (const [kind, t] of tries) {
    if (!t) continue;
    try {
      const arr = kind === "nominatim" ? await nominatimSearch(t) : await photonSearch(t);
      if (arr && arr.length) return { hit: arr[0], all: arr, query: t, engine: kind };
    } catch (e) { /* 다음 시도 */ }
    await new Promise((r) => setTimeout(r, 700));
  }
  return null;
}

function liveItemFromGeo(hit, query, all) {
  const parts = (hit.display_name || "").split(",").map((s) => s.trim()).filter(Boolean);
  const country = parts[parts.length - 1] || "—";
  const region = parts.slice(0, Math.max(1, parts.length - 1)).slice(-2).join(", ");
  return {
    id: "live-" + hit.id,
    ko: query,
    en: hit.name || parts[0] || query,
    country, countryEn: country,
    region: region || hit.display_name,
    farm: hit.name || query,
    producer: "—",
    alt: "—",
    variety: "—",
    process: "—",
    notes: [],
    story: `OpenStreetMap에서 실시간으로 찾은 위치입니다. ${hit.display_name} 기준으로 지도에 표시했어요. 이 위치의 농장·품종·가공 정보는 아직 확인되지 않았습니다.`,
    lat: hit.lat, lon: hit.lon,
    tier: "live", confidence: "live", confidenceLabel: "실시간 지오코딩",
    source: { label: "OpenStreetMap", url: "https://www.openstreetmap.org/?mlat=" + hit.lat + "&mlon=" + hit.lon + "#map=12/" + hit.lat + "/" + hit.lon },
    aliases: [query],
    alternatives: (all || []).slice(1, 4).map((h) => ({ name: h.display_name, lat: h.lat, lon: h.lon }))
  };
}

async function runSearch(raw) {
  const query = String(raw || "").trim();
  if (!query) return;
  hideSugg();
  qEl.value = query;
  const local = searchLocal(query);

  if (local.length) {
    state.results = local;
    state.livePin = null;
    if (local.length === 1) {
      selectItem(local[0], { fly: true, source: "search" });
      return;
    }
    // 여러 곳 → 결과 목록 + 모두 보이게
    state.selected = null;
    document.querySelector(".app").classList.remove("has-sel");
    setTimeout(() => map.invalidateSize(), 340);
    drawPins();
    const pts = local.map((i) => [i.lat, i.lon]);
    map.fitBounds(pts, { padding: [50, 50], maxZoom: 6 });
    renderSheet();
    return;
  }

  // 내장 DB에 없음 → Nominatim 실시간 지오코딩
  state.results = null;
  state.selected = null;
  state.geocoding = true;
  state.livePin = null;
  renderSheet();
  drawPins();

  const geo = await geocode(query);
  state.geocoding = false;

  if (!geo) {
    state.livePin = null;
    renderSheet({ error: query });
    drawPins();
    return;
  }
  const live = liveItemFromGeo(geo.hit, query, geo.all);
  state.livePin = live;
  state.selected = live;
  state.results = [live];
  drawPins();
  renderSheet();
  map.flyTo([live.lat, live.lon], 9, { duration: 1.5 });
  setURL({ coffee: null, q: query });
}

function selectItem(item, opts = {}) {
  state.selected = item;
  state.results = state.results && state.results.length > 1 ? state.results : null;
  if (item.tier !== "live") qEl.value = item.ko;
  document.querySelector(".app").classList.add("has-sel");
  setTimeout(() => map.invalidateSize(), 340);
  highlightPin();
  renderSheet();
  if (opts.fly) map.flyTo([item.lat, item.lon], item.tier === "lineup" ? 8 : 7, { duration: 1.35 });
  setURL({ coffee: item.tier === "live" ? null : item.id, q: item.tier === "live" ? item.ko : null });
}

function setURL({ coffee, q }) {
  const url = new URL(location.href);
  if (coffee) { url.searchParams.set("coffee", coffee); url.searchParams.delete("q"); }
  else url.searchParams.delete("coffee");
  if (q) { url.searchParams.set("q", q); } else if (q === null) url.searchParams.delete("q");
  try { history.replaceState(null, "", url); } catch (e) {}
}

function bindSheet() {
  sheetEl.querySelectorAll(".qcard[data-id], .res[data-id]").forEach((b) => {
    b.onclick = () => {
      const item = ALL.find((i) => i.id === b.dataset.id) || (state.livePin && state.livePin.id === b.dataset.id ? state.livePin : null);
      if (item) selectItem(item, { fly: true, source: "list" });
    };
  });
  sheetEl.querySelectorAll(".qcard[data-alt]").forEach((b) => {
    b.onclick = () => {
      const [lat, lon] = b.dataset.alt.split(",").map(Number);
      if (!isFinite(lat) || !isFinite(lon)) return;
      if (state.selected && state.selected.tier === "live") {
        state.selected.lat = lat; state.selected.lon = lon;
        state.livePin.lat = lat; state.livePin.lon = lon;
        drawPins();
        map.flyTo([lat, lon], 9, { duration: 1.2 });
      }
    };
  });
  sheetEl.querySelectorAll(".empty .tags button").forEach((b) => {
    b.onclick = () => runSearch(b.dataset.q);
  });
  const cp = $("#copyBtn", sheetEl);
  if (cp) {
    cp.onclick = async () => {
      try {
        const full = BASE_URL + "?coffee=" + (state.selected ? state.selected.id : "");
        await navigator.clipboard.writeText(full);
        cp.textContent = "복사됨";
        cp.classList.add("done");
        setTimeout(() => { cp.textContent = "링크 복사"; cp.classList.remove("done"); }, 1600);
      } catch (e) { cp.textContent = "길게 눌러 복사"; }
    };
  }
}

      <span>
        <span class="nm">${esc(i.ko)}</span>
        <span class="mt">${esc(i.country)} · ${esc(i.region)}${i.tier === "lineup" ? " · ★ 라인업" : ""}</span>
      </span>
    </button>`).join("");
  sugEl.classList.add("on");
  sugEl.querySelectorAll("button[data-id]").forEach((b) => {
    b.onclick = () => {
      const item = ALL.find((i) => i.id === b.dataset.id);
      qEl.value = item.ko;
      hideSugg();
      state.results = null;
      selectItem(item, { fly: true, source: "suggest" });
    };
  });
}

let suggestTimer = null;
qEl.addEventListener("input", () => {
  clearTimeout(suggestTimer);
  suggestTimer = setTimeout(() => showSugg(qEl.value), 130);
});
qEl.addEventListener("focus", () => { if (qEl.value.trim()) showSugg(qEl.value); });
qEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); runSearch(qEl.value); }
  if (e.key === "Escape") hideSugg();
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".search")) hideSugg();
});
$("#searchForm").addEventListener("submit", (e) => {
  e.preventDefault();
  runSearch(qEl.value);
});

/* ---------- 9. 시작 ---------- */
function boot() {
  renderChips();
  drawPins();
  renderSheet();

  const params = new URLSearchParams(location.search);
  const cid = params.get("coffee");
  const q = params.get("q");
  if (cid) {
    const item = ALL.find((i) => i.id === cid);
    if (item) {
      state.filter = "all";
      renderChips();
      drawPins();
      selectItem(item, { fly: true, source: "url" });
      return;
    }
  }
  if (q) {
    qEl.value = q;
    runSearch(q);
    return;
  }
  // 첫 방문: 모바일은 라인업(★) 중심, 넓은 화면은 커피 벨트 전체
  const narrow = window.innerWidth < 900;
  map.fitBounds((narrow ? LINEUP : ALL).map((i) => [i.lat, i.lon]), {
    padding: narrow ? [46, 46] : [22, 22], maxZoom: narrow ? 3 : 2
  });
}

boot();

// 디버그용 (콘솔에서 확인)
window.__originMap = { ALL, LINEUP, ORIGINS, state, searchLocal, map };
</script>
